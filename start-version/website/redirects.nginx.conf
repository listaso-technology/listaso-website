# Listaso static site: nginx snippet. Include inside the server { } block for listaso.com.
# Old WordPress URLs that changed or were removed -> new pages (301 = permanent, keeps Google ranking).

index index.html;
error_page 404 /404.html;
location ^~ /es/ { error_page 404 /es/404.html; }

# Clean URLs: /pre-sales -> /pre-sales/
rewrite ^/([a-z0-9-]+)$ /$1/ permanent;
rewrite ^/es/([a-z0-9-]+)$ /es/$1/ permanent;

location = /home/   { return 301 /; }
location = /home    { return 301 /; }
location = /rating/ { return 301 /support/; }
location ~ ^/integrations/(quickbooks|sage|acumatica|sap|zoho|acctivate|accountmate|netsuite)/?$ { return 301 /$1/; }

# Blog stays on WordPress at blog.listaso.com: send old blog addresses there
location = /blog  { return 301 https://blog.listaso.com/; }
location = /blog/ { return 301 https://blog.listaso.com/; }
location ^~ /category/ { return 301 https://blog.listaso.com$request_uri; }
