<!-- ===== Sami chat (AnythingLLM) + Zoho SalesIQ live-agent handoff ===== -->
<style>
  /* hide the default icon and show your own */
  #anything-llm-embed-chat-button svg { display: none !important; }
  #anything-llm-embed-chat-button {
    background: url('https://sami.listaso.com/assets/sami-logo.png') center / 100% no-repeat !important;
  }
</style>

<!-- ===== 1. Zoho SalesIQ init ===== -->
<script>
window.$zoho = window.$zoho || {};
$zoho.salesiq = $zoho.salesiq || {
  ready: function () {
    window.zohoIsReady = true;

    $zoho.salesiq.customfield.add({
        "name": "Company",
        "hint": "Enter your Company Name",
        "required": "true", // Change to "false" if you don't want it to be mandatory
        "visibility": "both" // Options: "online", "offline", or "both"
    });

    // If a live chat was started recently (page reload), show Zoho again; otherwise only AnythingLLM is visible
    if (window.isZohoActive && window.isZohoActive()) {
      try { $zoho.salesiq.floatbutton.visible("show"); } catch (e) {}
      try { $zoho.salesiq.floatwindow.visible("show"); } catch (e) {}
    } else {
      try { $zoho.salesiq.floatbutton.visible("hide"); } catch (e) {}
    }

    // When the Zoho chat is closed or finished, go back to AnythingLLM
    function backToBot() {
      try { $zoho.salesiq.floatwindow.visible("hide"); } catch (e) {}
      try { $zoho.salesiq.floatbutton.visible("hide"); } catch (e) {}
      var bot = document.querySelector('#anything-llm-embed-chat-container');
      if (bot) bot.style.display = '';
      window.popupShownReset && window.popupShownReset();
      window.clearZohoActive && window.clearZohoActive();
    }

    try { $zoho.salesiq.chat.close(backToBot); } catch (e) { console.warn('chat.close', e); }
    try { $zoho.salesiq.chat.complete(backToBot); } catch (e) { console.warn('chat.complete', e); }
  }
};
</script>
<script id="zsiqscript" src="https://salesiq.zohopublic.com/widget?wc=siq4dcb6db877368403e1fee26f2556235b0945e5968cb0af6774a92b016fe0d274" defer></script>

<!-- ===== 2. Handoff logic ===== -->
<script>
(function () {
  if (window.__handoffInit) return;          // never run twice
  window.__handoffInit = true;

  var BOT_SELECTOR = '#anything-llm-embed-chat-container';
  var MARKERS = ['🎧', '[[HANDOFF]]'];       // accepts both while you switch over
  var STORAGE_KEY = 'listaso_handoff_seen';  // old counter, cleared on load
  var popupShown = false;

  // Remember that a live chat is in progress, so a page reload shows Zoho instead of the bot
  var ACTIVE_KEY = 'listaso_zoho_active';
  var ACTIVE_TTL_MS = 2 * 60 * 60 * 1000;    // forget after 2 hours

  function hideBotCss(on) {                  // stylesheet rule works even if the bot renders late
    var el = document.getElementById('handoff-hide-bot');
    if (on && !el) {
      el = document.createElement('style');
      el.id = 'handoff-hide-bot';
      el.textContent = BOT_SELECTOR + '{display:none !important}';
      document.head.appendChild(el);
    } else if (!on && el) {
      el.remove();
    }
  }
  function markZohoActive() {
    try { localStorage.setItem(ACTIVE_KEY, String(Date.now())); } catch (e) {}
    hideBotCss(true);
  }
  function isZohoActive() {
    try {
      var t = parseInt(localStorage.getItem(ACTIVE_KEY) || '0', 10);
      return !!t && (Date.now() - t) < ACTIVE_TTL_MS;
    } catch (e) { return false; }
  }
  window.isZohoActive = isZohoActive;
  window.clearZohoActive = function () {
    try { localStorage.removeItem(ACTIVE_KEY); } catch (e) {}
    hideBotCss(false);
  };
  if (isZohoActive()) hideBotCss(true);      // hide the bot immediately on reload

  // Business hours (Eastern time, handles daylight saving automatically)
  var HOURS = { tz: 'America/New_York', open: 8, close: 20, days: [1, 2, 3, 4, 5] }; // Mon-Fri
  var HOLIDAYS = [];                         // closed dates, e.g. ['2026-11-26', '2026-12-25']

  /* ---------- helpers ---------- */

  function isEs() {
    var pageLang = (document.documentElement.lang || '').toLowerCase();
    if (pageLang) return pageLang.indexOf('es') === 0;
    return (navigator.language || '').toLowerCase().indexOf('es') === 0;
  }

  function stripMarkers(text) {
    MARKERS.forEach(function (m) { text = text.split(m).join(''); });
    return text;
  }

  function getBotTranscript() {
    var bot = document.querySelector(BOT_SELECTOR);
    return bot ? stripMarkers(bot.innerText).trim().slice(-1500) : '';
  }

  function isOpenNow() {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: HOURS.tz, weekday: 'short', hour: 'numeric', hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var p = {};
    parts.forEach(function (x) { p[x.type] = x.value; });

    var dayNum = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[p.weekday];
    var hour = parseInt(p.hour, 10) % 24;    // some browsers return "24" at midnight
    var dateStr = p.year + '-' + p.month + '-' + p.day;

    if (HOLIDAYS.indexOf(dateStr) !== -1) return false;
    if (HOURS.days.indexOf(dayNum) === -1) return false;
    return hour >= HOURS.open && hour < HOURS.close;
  }
  window.isOpenNow = isOpenNow;              // for testing from the console

  function makeOverlay(html) {
    var overlay = document.createElement('div');
    overlay.style.cssText =
      'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2147483000;' +
      'display:flex;align-items:center;justify-content:center;font-family:sans-serif;';
    overlay.innerHTML = html;
    // Keep the widget from seeing clicks on the popup
    ['mousedown', 'mouseup', 'click', 'touchstart', 'pointerdown'].forEach(function (evt) {
      overlay.addEventListener(evt, function (e) { e.stopPropagation(); });
    });
    document.body.appendChild(overlay);
    return overlay;
  }

  function showBot() {
    var bot = document.querySelector(BOT_SELECTOR);
    if (bot) bot.style.display = '';
  }

  /* ---------- open Zoho live chat ---------- */

  function openZoho() {
    var siq = window.$zoho && $zoho.salesiq;
    if (!siq || !window.zohoIsReady) {
      console.warn('[handoff] Zoho not ready');
      window.location.href = 'mailto:cs@listaso.com';
      return;
    }

    var transcript = getBotTranscript();     // read BEFORE hiding the bot

    try { siq.floatbutton.visible("show"); } catch (e) { console.warn('[handoff] floatbutton failed:', e); }

    try {
      if (siq.visitor && typeof siq.visitor.question === 'function') {
        siq.visitor.question('Escalated from AI assistant. Recent conversation:\n' + transcript);
      }
    } catch (e) { console.warn('[handoff] question failed:', e); }

    try { siq.floatwindow.visible("show"); } catch (e) { console.warn('[handoff] floatwindow failed:', e); }
    markZohoActive();

    // Hide AnythingLLM only after Zoho has had time to appear
    setTimeout(function () {
      var bot = document.querySelector(BOT_SELECTOR);
      if (bot) bot.style.display = 'none';
    }, 400);
  }

  /* ---------- popups ---------- */

  function showClosedPopup() {
    var t = isEs() ? {
      title: 'Nuestro equipo está fuera de horario',
      body: 'Atendemos de lunes a viernes, 8am a 8pm (hora del Este). Escríbenos y te responderemos pronto.',
      email: 'Correo de soporte', phone: 'Teléfono', urgent: 'Urgencias fuera de horario', close: 'Cerrar'
    } : {
      title: 'Our team is away right now',
      body: 'We are available Monday to Friday, 8am to 8pm Eastern. Send us a message and we will get back to you.',
      email: 'Support email', phone: 'Phone', urgent: 'Urgent issues after hours', close: 'Close'
    };

    var overlay = makeOverlay(
      '<div style="background:#fff;border-radius:12px;padding:24px;max-width:360px;width:90%;' +
      'text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)">' +
      '<h3 style="margin:0 0 8px !important;color:#111827 !important;font-size:20px !important;font-weight:700 !important;background:none !important;">' + t.title + '</h3>' +
      '<p style="margin:0 0 16px;color:#444">' + t.body + '</p>' +
      '<p style="margin:0 0 6px;color:#444">' + t.email + ': <a href="mailto:cs@listaso.com">cs@listaso.com</a></p>' +
      '<p style="margin:0 0 6px;color:#444">' + t.phone + ': <a href="tel:+13059127770">+1 305-912-7770</a></p>' +
      '<p style="margin:0 0 20px;color:#444">' + t.urgent + ': <a href="mailto:sos@listaso.com">sos@listaso.com</a></p>' +
      '<button id="handoff-close" style="background:#0a66c2 !important;color:#ffffff !important;border:0;border-radius:8px;' +
      'padding:10px 18px;cursor:pointer;font-weight:600">' + t.close + '</button></div>'
    );

    overlay.querySelector('#handoff-close').onclick = function () {
      popupShown = false;
      overlay.remove();
      showBot();
    };
  }

  function showHandoffPopup() {
    if (popupShown) return;
    popupShown = true;

    if (!isOpenNow()) { showClosedPopup(); return; }

    var t = isEs() ? {
      title: '¿Necesitas hablar con una persona?',
      body: '¿Quieres chatear con un agente en vivo?',
      yes: 'Hablar con un agente', no: 'Ahora no'
    } : {
      title: 'Need a person?',
      body: 'Would you like to chat with a live agent?',
      yes: 'Talk to a live agent', no: 'Not now'
    };

    var overlay = makeOverlay(
      '<div style="background:#fff;border-radius:12px;padding:24px;max-width:340px;width:90%;' +
      'text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)">' +
      '<h3 style="margin:0 0 8px !important;color:#111827 !important;font-size:20px !important;font-weight:700 !important;background:none !important;">' + t.title + '</h3>' +
      '<p style="margin:0 0 20px;color:#444">' + t.body + '</p>' +
      '<button id="handoff-yes" style="background:#0a66c2 !important;color:#ffffff !important;border:0;border-radius:8px;' +
      'padding:10px 18px;cursor:pointer;margin-right:8px">' + t.yes + '</button>' +
      '<button id="handoff-no" style="background:#ffffff !important;color:#0a66c2 !important;border:1.5px solid #0a66c2 !important;border-radius:8px;' +
      'padding:10px 18px;cursor:pointer;font-weight:600">' + t.no + '</button></div>'
    );

    overlay.querySelector('#handoff-yes').onclick = function () {
      popupShown = false; overlay.remove(); openZoho();
    };
    overlay.querySelector('#handoff-no').onclick = function () {
      popupShown = false; overlay.remove(); showBot();
    };
  }

  window.showHandoffPopup = showHandoffPopup;              // for testing from the console
  window.popupShownReset = function () { popupShown = false; };   // called by Zoho's backToBot

  /* ---------- detect a NEW marker only ---------- */
  // Markers are counted only inside Sami's message list (#chat-history).
  // The widget builds a fresh list every time the chat window opens (page load,
  // new page, reopening the bubble), so whatever the list holds at that moment
  // is old history and is ignored. Markers that appear later in the same list
  // are new. "Reset Chat" removes the list, so the next conversation starts
  // again from zero and its first handoff fires normally.
  var HISTORY_SEL = BOT_SELECTOR + ' #chat-history';
  var listNode = null, seen = 0, debounce = null;
  try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}   // left over from the old counter

  function countMarkers(text) {
    var n = 0;
    MARKERS.forEach(function (m) { n += text.split(m).length - 1; });
    return n;
  }
  function markersIn(node) {
    return node ? countMarkers(node.innerText || node.textContent || '') : 0;
  }
  window.resetHandoffSeen = function () { seen = 0; };   // for testing from the console

  function check() {
    var list = document.querySelector(HISTORY_SEL);
    if (list !== listNode) {                 // list appeared, was rebuilt, or went away
      listNode = list;
      seen = markersIn(list);                // what is already there is history
      return;
    }
    if (!list) return;
    var count = markersIn(list);
    if (count > seen) setTimeout(showHandoffPopup, 900);   // let the user read Sami's message first
    seen = count;
  }

  new MutationObserver(function () {
    clearTimeout(debounce);
    // A new list is snapshotted right away, before any reply can stream into it
    if (document.querySelector(HISTORY_SEL) !== listNode) { check(); return; }
    debounce = setTimeout(check, 200);       // avoid reading innerText on every streamed token
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>

</script>
